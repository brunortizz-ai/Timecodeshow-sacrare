<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>TIMEcode SHOW — Sacrare</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080808;color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
.wrap{max-width:820px;margin:auto;padding:22px 18px 35px}
h1{font-size:28px;margin:0 0 4px}
.top{color:#aaa;font-size:16px;margin-bottom:18px}
.card{
  background:#171717;border:1px solid #333;border-radius:28px;
  padding:28px 22px 24px;text-align:center
}
.label{font-size:14px;letter-spacing:2px;color:#aaa;text-transform:uppercase}
.current{
  font-size:32px;font-weight:750;text-align:left;margin:12px 0 8px;
  line-height:1.12
}
.type{font-size:17px;color:#aaa;text-align:left}
.timer{font-size:88px;font-weight:800;letter-spacing:2px;margin:30px 0 5px}
.sub{font-size:18px;color:#aaa}
.progress{height:10px;background:#303030;border-radius:99px;overflow:hidden;margin:28px 0}
.bar{height:100%;width:0;background:#fff;border-radius:99px}
.next{text-align:left;font-size:24px;font-weight:700;margin-top:6px}
.nexttime{font-size:20px;margin-top:8px}
.status{color:#aaa;margin-top:22px;min-height:24px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.small{
  background:#171717;border:1px solid #333;border-radius:22px;
  padding:20px 18px
}
.value{font-size:30px;font-weight:750;margin-top:8px}
.buttons{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:12px}
button{
  border:0;border-radius:24px;padding:20px 10px;
  background:#292929;color:#fff;font-size:18px;font-weight:700
}
button.primary{background:#fff;color:#000}
button:active{transform:scale(.98)}
.list{margin-top:18px}
.row{
  display:grid;grid-template-columns:125px 1fr 70px;gap:10px;
  align-items:center;padding:16px 10px;border-bottom:1px solid #292929
}
.row.active{background:#1d1d1d;border-radius:15px}
.row .start,.row .dur{color:#aaa;font-variant-numeric:tabular-nums}
.row .name{font-size:17px}
.row .kind{font-size:13px;color:#888;margin-top:4px}
audio{display:none}
@media(max-width:520px){
  .wrap{padding:18px 12px 28px}
  .card{padding:25px 16px 22px}
  .current{font-size:30px}
  .timer{font-size:70px}
  .next{font-size:22px}
  .row{grid-template-columns:90px 1fr 58px;padding:15px 5px}
  .row .name{font-size:15px}
  .value{font-size:25px}
}
</style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <h1>TIMEcode SHOW</h1>
    Sacrare • áudio por faixa • sincronizado pelo áudio
  </div>

  <div class="card">
    <div class="label">Momento atual</div>
    <div class="current" id="current">1 ABERTURA + 99 NÃO É 100</div>
    <div class="type" id="type">Áudio • 04:05</div>

    <div class="timer" id="timer">00:00</div>
    <div class="sub" id="remainText">decorrido • 04:05 restantes neste momento</div>

    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="label" style="text-align:left">Próximo</div>
    <div class="next" id="next">2 APRESENTAÇÃO</div>
    <div class="nexttime" id="nexttime">começa em 04:05</div>

    <div class="status" id="status">Toque em Iniciar para tocar o áudio.</div>
  </div>

  <div class="stats">
    <div class="small">
      <div class="label">Show decorrido</div>
      <div class="value" id="showElapsed">00:00</div>
    </div>
    <div class="small">
      <div class="label">Show restante</div>
      <div class="value" id="showRemaining">01:00:07</div>
    </div>
  </div>

  <div class="buttons">
    <button id="back">↩️ Voltar</button>
    <button class="primary" id="play">▶️ Iniciar</button>
    <button id="nextBtn">Próximo ⏭️</button>
  </div>

  <div class="list" id="list"></div>
</div>

<audio id="audio" preload="metadata" playsinline></audio>

<script>
/*
  IMPORTANTE:
  Os nomes abaixo são exatamente os nomes dos arquivos MP3 enviados ao GitHub.
  O encodeURI() é aplicado somente na hora de montar a URL.
  Assim, espaços, acentos e outros caracteres do nome continuam funcionando.
*/

const tracks = [
  ["1 ABERTURA + 99 NÃO É 100","1 ABERTURA + 99 NÃO É 100.mp3",245],
  ["3 APRESENTAÇÃO","2 APRESENTAÇÃO.mp3",37],
  ["2 RESTAURADOR","3 RESTAURADOR.mp3",265],
  ["4 MEDLEY ALEGRIA","4 MEDLEY ALEGRIA.mp3",320],
  ["5 FALA DA BOTA","5 FALA DA BOTA.mp3",39],
  ["6 CHEIA DE GRAÇA","6 CHEIA DE GRAÇA.mp3",309],
  ["7 FALA REDES SOCIAIS","7 FALA REDES SOCIAIS.mp3",89],
  ["8 INSPIRA","8 INSPIRA.mp3",213],
  ["9 MINISTRAÇÃO CAROL","9 MINISTRAÇÃO CAROL.mp3",150],
  ["10 LUGAR SEGURO","10 LUGAR SEGURO.mp3",284],
  ["11 MINISTRAÇÃO DAMI","11 MINISTRAÇÃO DAMI.mp3",60],
  ["12 JESUS ESTÁ AQUI + LÁZARO","12 JESUS ESTÁ AQUI + LÁZARO.mp3",372],
  ["13 TEMPO LIVRE DE ORAÇÃO 4 MINUTOS","13 TEMPO LIVRE DE ORAÇÃO 4 MINUTOS.mp3",241],
  ["14 AGRADECIMENTO + APRESENTAÇÃO DA BANDA + ENSINAR ALTERADO","14 AGRADECIMENTO + APRESENTAÇÃO DA BANDA + ENSINAR ALTERADO.mp3",188],
  ["15 ALTERADO","15 ALTERADO.mp3",225],
  ["16 MEDLEY TENDA","16 MEDLEY TENDA.mp3",263],
  ["17 FALA FINAL REDES SOCIAIS","17 FALA FINAL REDES SOCIAIS.mp3",92],
  ["18 EVANGELIZAR","18 EVANGELIZAR.mp3",215]
];

const audio = document.getElementById("audio");
const currentEl = document.getElementById("current");
const typeEl = document.getElementById("type");
const timerEl = document.getElementById("timer");
const remainTextEl = document.getElementById("remainText");
const nextEl = document.getElementById("next");
const nexttimeEl = document.getElementById("nexttime");
const showElapsedEl = document.getElementById("showElapsed");
const showRemainingEl = document.getElementById("showRemaining");
const barEl = document.getElementById("bar");
const statusEl = document.getElementById("status");
const listEl = document.getElementById("list");

let index = 0;
let started = false;
let changing = false;

const total = tracks.reduce((sum,t)=>sum+t[2],0);

function fmt(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  return h
    ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
    : `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

let githubFiles = null;

async function resolveAudioUrl(filename){
  if(!githubFiles){
    const response = await fetch(
      "https://api.github.com/repos/brunortizz-ai/Timecodeshow-sacrare/contents/",
      {cache:"no-store"}
    );
    if(!response.ok) throw new Error("GitHub API: "+response.status);
    githubFiles = await response.json();
  }

  const wanted = filename.normalize("NFC").toLowerCase();
  const file = githubFiles.find(f =>
    f.type === "file" &&
    f.name.toLowerCase().normalize("NFC") === wanted
  );

  if(!file || !file.download_url){
    throw new Error("MP3 não encontrado: "+filename);
  }

  return file.download_url;
}

async function setAudioForTrack(filename){
  const url = await resolveAudioUrl(filename);
  audio.src = url;
  audio.load();
}

function loadTrack(i, autoplay=false){
  index = Math.max(0, Math.min(tracks.length-1,i));
  const t = tracks[index];

  // O GitHub pode armazenar acentos em uma forma Unicode diferente.
  // Em vez de montar a URL pelo nome, buscamos no próprio GitHub o
  // arquivo cujo nome normalizado corresponde ao MP3 cadastrado.
  currentEl.textContent = t[0];
  typeEl.textContent = `Áudio • ${fmt(t[2])}`;

  const next = tracks[index+1];
  nextEl.textContent = next ? next[0] : "Fim do show";
  nexttimeEl.textContent = next ? `começa em ${fmt(t[2])}` : "show encerrado";

  statusEl.textContent = autoplay
    ? "Carregando áudio…"
    : "Toque em Iniciar para tocar o áudio.";

  renderList();
  update();

  (async()=>{
    try{
      await setAudioForTrack(t[1]);

      if(autoplay){
        await audio.play();
        started=true;
        statusEl.textContent="▶️ Tocando";
        document.getElementById("play").textContent="⏸️ Pausar";
      }
    }catch(e){
      started=false;
      statusEl.textContent="Não foi possível carregar este MP3. O arquivo não foi localizado no GitHub.";
      document.getElementById("play").textContent="▶️ Iniciar";
      console.error(e);
    }
  })();
}

function renderList(){
  let elapsed=0;
  listEl.innerHTML="";

  tracks.forEach((t,i)=>{
    const row=document.createElement("div");
    row.className="row"+(i===index?" active":"");

    const start=document.createElement("div");
    start.className="start";
    start.textContent=fmt(elapsed);

    const mid=document.createElement("div");
    mid.innerHTML=`<div class="name">${escapeHtml(t[0])}</div>
                  <div class="kind">MP3 • ${fmt(t[2])}</div>`;

    const dur=document.createElement("div");
    dur.className="dur";
    dur.textContent=fmt(t[2]);

    row.append(start,mid,dur);
    row.onclick=()=>{
      loadTrack(i,false);
    };

    listEl.appendChild(row);
    elapsed+=t[2];
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  }[m]));
}

function getCurrentTime(){
  return Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
}

function showElapsed(){
  let x=0;
  for(let i=0;i<index;i++) x+=tracks[i][2];
  return x+getCurrentTime();
}

function update(){
  const t=tracks[index];
  const current=Math.min(getCurrentTime(),t[2]);
  const remaining=Math.max(0,t[2]-current);
  const elapsed=showElapsed();
  const showRemaining=Math.max(0,total-elapsed);

  timerEl.textContent=fmt(current);
  remainTextEl.textContent=`decorrido • ${fmt(remaining)} restantes neste momento`;
  barEl.style.width=`${Math.min(100,current/t[2]*100)}%`;
  showElapsedEl.textContent=fmt(elapsed);
  showRemainingEl.textContent=fmt(showRemaining);

  if(tracks[index+1]){
    nexttimeEl.textContent=`começa em ${fmt(remaining)}`;
  }

  renderActiveOnly();
}

function renderActiveOnly(){
  [...listEl.children].forEach((r,i)=>{
    r.classList.toggle("active",i===index);
  });
}

document.getElementById("play").onclick=async()=>{
  if(!audio.src){
    try{
      await setAudioForTrack(tracks[index][1]);
    }catch(e){
      statusEl.textContent="Não foi possível carregar este MP3. O arquivo não foi localizado no GitHub.";
      return;
    }
  }

  if(audio.paused){
    try{
      await audio.play();
      started=true;
      statusEl.textContent="▶️ Tocando";
      document.getElementById("play").textContent="⏸️ Pausar";
    }catch(e){
      statusEl.textContent="Não foi possível tocar. Toque novamente em Iniciar.";
    }
  }else{
    audio.pause();
    statusEl.textContent="⏸️ Pausado";
    document.getElementById("play").textContent="▶️ Iniciar";
  }
};

document.getElementById("nextBtn").onclick=()=>{
  if(index<tracks.length-1){
    loadTrack(index+1,true);
  }
};

document.getElementById("back").onclick=()=>{
  if(getCurrentTime()>3){
    audio.currentTime=0;
    update();
  }else if(index>0){
    loadTrack(index-1,true);
  }
};

audio.addEventListener("timeupdate",update);

audio.addEventListener("ended",()=>{
  if(changing) return;
  changing=true;

  if(index<tracks.length-1){
    loadTrack(index+1,true);
  }else{
    started=false;
    statusEl.textContent="🏁 Show encerrado";
    document.getElementById("play").textContent="▶️ Iniciar";
    update();
  }

  setTimeout(()=>changing=false,500);
});

audio.addEventListener("error",()=>{
  statusEl.textContent="Não foi possível carregar este MP3. Confira se o nome do arquivo no GitHub está exatamente igual.";
});

loadTrack(0,false);
</script>
</body>
</html>
