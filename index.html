<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TIMEcode SHOW — Sacrare</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 16px 28px}.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}.badge{font-size:12px;color:#aaa}.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:20px;margin-top:14px}
.label{font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:.08em}.current{font-size:29px;font-weight:750;margin:7px 0 4px}.type{font-size:14px;color:#aaa}
.timer{font-variant-numeric:tabular-nums;font-size:64px;font-weight:800;text-align:center;margin:22px 0 2px}.sub{text-align:center;color:#aaa;font-size:13px}
.progress{height:9px;background:#292929;border-radius:99px;overflow:hidden;margin:18px 0}.bar{height:100%;width:0;background:#fff}
.next{font-size:20px;font-weight:650;margin-top:5px}.nexttime{font-size:27px;font-variant-numeric:tabular-nums;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{background:#151515;border:1px solid #292929;border-radius:14px;padding:13px}
.stat b{display:block;font-size:21px;margin-top:4px;font-variant-numeric:tabular-nums}.buttons{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;margin-top:14px}
button{border:0;border-radius:14px;padding:16px 10px;background:#292929;color:#fff;font-size:16px;font-weight:700}button.main{background:#fff;color:#000}
.audio{margin-top:12px;color:#aaa;font-size:12px;text-align:center;min-height:18px}.list{margin-top:14px}
.row{display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:center;padding:11px 4px;border-bottom:1px solid #222;font-size:14px}
.row.active{background:#202020;border-radius:10px;padding-left:10px}.time,.dur{color:#aaa;font-variant-numeric:tabular-nums}.dur{text-align:right}.small{color:#aaa;font-size:12px;margin-top:4px}
@media(max-width:480px){.timer{font-size:54px}.current{font-size:25px}.row{grid-template-columns:64px 1fr 60px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>TIMEcode SHOW</h1><div class="badge">Sacrare • áudio em 5 partes</div></div><div id="count">1 / 19</div></div>

<div class="card">
<div class="label">Momento atual</div><div class="current" id="current"></div><div class="type" id="type"></div>
<div class="timer" id="elapsed">00:00</div>
<div class="sub">decorrido • <span id="remainCurrent">00:00</span> restantes</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="label">Próximo</div><div class="next" id="next"></div>
<div class="nexttime">começa em <span id="toNext">00:00</span></div>
<div class="audio" id="audioStatus">Áudio pronto para iniciar</div>
</div>

<div class="grid">
<div class="stat"><span class="label">Show decorrido</span><b id="showElapsed">00:00:00</b></div>
<div class="stat"><span class="label">Show restante</span><b id="showRemain">01:00:00</b></div>
</div>

<div class="buttons">
<button onclick="prev()">↩ Voltar</button>
<button class="main" id="play" onclick="toggle()">▶ Iniciar</button>
<button onclick="next()">Próximo ⏭</button>
</div>

<div class="list" id="list"></div>
<audio id="audio" preload="auto"></audio>
</div>

<script>
const parts=[
"01 - VS SHOW SACRARE 2026.mp3",
"02 - VS SHOW SACRARE 2026.mp3",
"03 - VS SHOW SACRARE 2026.mp3",
"04 - VS SHOW SACRARE 2026.mp3",
"05 - VS SHOW SACRARE 2026.mp3"
];

const partDur=[730.8,730.8,730.8,730.8,676.2];

const items=[
["Abertura + 99 não é 100",254,"Música"],
["Restaurador",275,"Música"],
["Fala apresentação + lados",40,"Fala"],
["Medley Alegria",320,"Música"],
["Fala bota e chapéu",40,"Fala"],
["Cheia de Graça",308,"Música"],
["Fala redes sociais + Sacrare + story",90,"Fala"],
["Inspira",216,"Música"],
["Ministração Carol",150,"Ministração"],
["Lugar Seguro",280,"Música"],
["Ministração Dami",60,"Ministração"],
["Jesus está aqui + Lázaro",375,"Música"],
["Oração livre + refrão Jesus está aqui",240,"Oração"],
["Apresentação banda + agradecimento + lados",90,"Fala"],
["Ensina dança + fala EP Alterado",90,"Fala"],
["Alterado",230,"Música"],
["Medley Tenda / Seja / Jesus",260,"Música"],
["Fala tchau + Eu não vou embora + redes sociais",90,"Fala"],
["Evangelizar",194,"Música"]
];

let idx=0, elapsed=0, running=false, audioPart=0, offsetInPart=0, raf=null;

const audio=document.getElementById("audio");

function fmt(s,h=false){
s=Math.max(0,Math.floor(s));let hh=Math.floor(s/3600),mm=Math.floor((s%3600)/60),ss=s%60;
return (h||hh)?String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0"):String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
}

function before(i){return items.slice(0,i).reduce((a,x)=>a+x[1],0)}
function total(){return items.reduce((a,x)=>a+x[1],0)}

function locate(global){
let p=0;
for(let i=0;i<partDur.length;i++){if(global < p+partDur[i] || i===partDur.length-1)return [i,Math.max(0,global-p)];p+=partDur[i]}
return [partDur.length-1,partDur.at(-1)]
}

function setAudioPosition(global){
let loc=locate(global), pi=loc[0], pos=loc[1];
if(audioPart!==pi || !audio.src){
audioPart=pi;
audio.src=encodeURI(parts[pi]);
audio.load();
}
offsetInPart=pos;
try{audio.currentTime=pos}catch(e){}
}

function globalAudioTime(){
let t=0;for(let i=0;i<audioPart;i++)t+=partDur[i];return t+audio.currentTime;
}

function syncFromAudio(){
let g=globalAudioTime(), showT=0, found=items.length-1;
for(let i=0;i<items.length;i++){if(g<showT+items[i][1]){found=i;break}showT+=items[i][1]}
idx=found;elapsed=Math.max(0,g-showT);render();
}

function render(){
let it=items[idx], dur=it[1], se=before(idx)+elapsed;
document.getElementById("current").textContent=it[0];
document.getElementById("type").textContent=it[2]+" • "+fmt(dur);
document.getElementById("elapsed").textContent=fmt(elapsed);
document.getElementById("remainCurrent").textContent=fmt(dur-elapsed);
document.getElementById("bar").style.width=Math.min(100,elapsed/dur*100)+"%";
document.getElementById("next").textContent=items[idx+1]?.[0]||"FIM DO SHOW";
document.getElementById("toNext").textContent=items[idx+1]?fmt(dur-elapsed):"—";
document.getElementById("showElapsed").textContent=fmt(se,true);
document.getElementById("showRemain").textContent=fmt(Math.max(0,total()-se),true);
document.getElementById("count").textContent=(idx+1)+" / "+items.length;
document.getElementById("play").textContent=running?"⏸ Pausar":"▶ Iniciar";
document.querySelectorAll(".row").forEach((r,i)=>r.classList.toggle("active",i===idx));
}

function loop(){
if(!running)return;
syncFromAudio();
requestAnimationFrame(loop);
}

function start(){
audio.play().then(()=>{running=true;document.getElementById("audioStatus").textContent="▶ Tocando • parte "+(audioPart+1)+"/5";loop()})
.catch(()=>{document.getElementById("audioStatus").textContent="Toque novamente em Iniciar para liberar o áudio."});
}

function toggle(){
if(running){audio.pause();running=false;document.getElementById("audioStatus").textContent="⏸ Pausado";render();return}
start();
}

audio.addEventListener("ended",()=>{
if(audioPart<parts.length-1){
audioPart++;
audio.src=encodeURI(parts[audioPart]);
audio.load();
audio.addEventListener("loadedmetadata",function once(){
audio.removeEventListener("loadedmetadata",once);
audio.currentTime=0;
if(running)audio.play().catch(()=>{});
});
document.getElementById("audioStatus").textContent="▶ Parte "+(audioPart+1)+"/5";
}else{
running=false;
idx=items.length-1;elapsed=items.at(-1)[1];
document.getElementById("audioStatus").textContent="Show finalizado";
}
render();
});

audio.addEventListener("timeupdate",()=>{if(running)syncFromAudio()});

function jumpGlobal(g){
g=Math.max(0,Math.min(total()-0.01,g));
let loc=locate(g);audioPart=loc[0];audio.src=encodeURI(parts[audioPart]);audio.load();
audio.addEventListener("loadedmetadata",function once(){audio.removeEventListener("loadedmetadata",once);audio.currentTime=loc[1];if(running)audio.play().catch(()=>{});});
let acc=0;
for(let i=0;i<items.length;i++){if(g<acc+items[i][1]){idx=i;elapsed=g-acc;break}acc+=items[i][1]}
render();
}

function next(){
jumpGlobal(before(Math.min(items.length-1,idx+1)));
}
function prev(){
jumpGlobal(before(Math.max(0,idx-1)));
}

items.forEach((it,i)=>{
let r=document.createElement("div");r.className="row";
r.onclick=()=>jumpGlobal(before(i));
r.innerHTML=`<div class="time">${fmt(before(i),true)}</div><div>${it[0]}<div class="small">${it[2]}</div></div><div class="dur">${fmt(it[1])}</div>`;
document.getElementById("list").appendChild(r);
});

render();
setAudioPosition(0);
</script>
</body>
</html>
