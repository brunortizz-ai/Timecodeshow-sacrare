<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>TIMEcode SHOW — Sacrare</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 16px 28px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:#aaa;margin-bottom:18px}
.card,.small{background:#151515;border:1px solid #292929;border-radius:24px}
.card{padding:28px 24px}
.label{font-size:14px;color:#aaa;text-transform:uppercase;letter-spacing:1.5px}
.current{font-size:34px;font-weight:750;margin-top:8px;line-height:1.1}
.type{color:#bbb;margin-top:10px}
.timer{text-align:center;font-size:76px;font-weight:800;letter-spacing:1px;margin:28px 0 10px}
.remaining{text-align:center;color:#aaa;font-size:17px}
.progress{height:10px;background:#292929;border-radius:99px;overflow:hidden;margin:24px 0}
.bar{height:100%;width:0;background:#fff}
.next{font-size:22px;font-weight:650}
.nexttime{font-size:18px;color:#bbb;margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.small{padding:20px}
.small .value{font-size:29px;font-weight:750;margin-top:8px}
.buttons{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;margin-top:12px}
button{border:0;border-radius:22px;padding:20px 10px;font-size:18px;font-weight:700;background:#292929;color:#fff}
button.primary{background:#fff;color:#000}
.list{margin-top:14px}
.row{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;padding:16px 10px;border-bottom:1px solid #292929}
.row.active{background:#202020;border-radius:18px}
.row .start,.row .len{color:#aaa}
.row .name{font-size:17px}
.row .kind{font-size:13px;color:#999;margin-top:4px}
.status{color:#aaa;text-align:center;margin-top:12px;font-size:14px}
@media(max-width:480px){
 .timer{font-size:58px}
 .current{font-size:29px}
 .row{grid-template-columns:85px 1fr 58px}
 .row .name{font-size:15px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>TIMEcode SHOW</h1>
    <div class="sub">Sacrare • áudio por faixa • sincronizado pelo áudio</div>
  </div>

  <div class="card">
    <div class="label">Momento atual</div>
    <div class="current" id="current">1 ABERTURA + 99 NÃO É 100</div>
    <div class="type" id="type">Áudio • 04:05</div>

    <div class="timer" id="timer">00:00</div>
    <div class="remaining">decorrido • <span id="remainCurrent">04:05</span> restantes neste momento</div>

    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="label">Próximo</div>
    <div class="next" id="next">2 APRESENTAÇÃO</div>
    <div class="nexttime" id="nexttime">começa em 04:05</div>
    <div class="status" id="status">Toque em Iniciar para tocar o áudio.</div>
  </div>

  <div class="stats">
    <div class="small">
      <div class="label">Show decorrido</div>
      <div class="value" id="showElapsed">00:00:00</div>
    </div>
    <div class="small">
      <div class="label">Show restante</div>
      <div class="value" id="showRemaining">01:00:07</div>
    </div>
  </div>

  <div class="buttons">
    <button id="back">↩️ Voltar</button>
    <button class="primary" id="play">▶️ Iniciar</button>
    <button id="nextBtn">Próximo ⏭️</button>
  </div>

  <div class="list" id="list"></div>
</div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
const tracks = [
  ["1 ABERTURA + 99 NÃO É 100","1 ABERTURA + 99 NÃO É 100.mp3",245],
  ["2 APRESENTAÇÃO","2 APRESENTAÇÃO.mp3",37],
  ["3 RESTAURADOR","3 RESTAURADOR.mp3",265],
  ["4 MEDLEY ALEGRIA","4 MEDLEY ALEGRIA.mp3",320],
  ["5 FALA DA BOTA","5 FALA DA BOTA.mp3",39],
  ["6 CHEIA DE GRAÇA","6 CHEIA DE GRAÇA.mp3",309],
  ["7 FALA REDES SOCIAIS","7 FALA REDES SOCIAIS.mp3",89],
  ["8 INSPIRA","8 INSPIRA.mp3",213],
  ["9 MINISTRAÇÃO CAROL","9 MINISTRAÇÃO CAROL.mp3",150],
  ["10 LUGAR SEGURO","10 LUGAR SEGURO.mp3",284],
  ["11 MINISTRAÇÃO DAMI","11 MINISTRAÇÃO DAMI.mp3",60],
  ["12 JESUS ESTÁ AQUI + LÁZARO","12 JESUS ESTÁ AQUI + LÁZARO.mp3",372],
  ["13 TEMPO LIVRE DE ORAÇÃO 4 MINUTOS","13 TEMPO LIVRE DE ORAÇÃO 4 MINUTOS.mp3",241],
  ["14 AGRADECIMENTO + APRESENTAÇÃO DA BANDA + ENSINAR ALTERADO","14 AGRADECIMENTO + APRESENTAÇÃO DA BANDA + ENSINAR ALTERADO.mp3",188],
  ["15 ALTERADO","15 ALTERADO.mp3",225],
  ["16 MEDLEY TENDA","16 MEDLEY TENDA.mp3",263],
  ["17 FALA FINAL REDES SOCIAIS","17 FALA FINAL REDES SOCIAIS.mp3",92],
  ["18 EVANGELIZAR","18 EVANGELIZAR.mp3",215]
];

const audio=document.getElementById("audio");
let index=0;
let started=false;

const total=tracks.reduce((a,t)=>a+t[2],0);
const starts=tracks.map((t,i)=>tracks.slice(0,i).reduce((a,x)=>a+x[2],0));

function fmt(s){
  s=Math.max(0,Math.floor(s));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return h ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}` :
             `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}
function fmtH(s){
  return fmt(s);
}
function urlFor(name){ return "./"+encodeURIComponent(name); }

function loadTrack(i, autoplay=false){
  index=Math.max(0,Math.min(tracks.length-1,i));
  const t=tracks[index];
  audio.src=urlFor(t[1]);
  audio.currentTime=0;
  render();
  if(autoplay){
    const p=audio.play();
    if(p) p.catch(()=> {
      document.getElementById("status").textContent="Toque em Iniciar para liberar o áudio.";
      started=false;
    });
  }
}

function render(){
  const t=tracks[index];
  document.getElementById("current").textContent=t[0];
  document.getElementById("type").textContent="Áudio • "+fmt(t[2]);
  document.getElementById("next").textContent=index<tracks.length-1?tracks[index+1][0]:"Fim do show";
  document.getElementById("nexttime").textContent=index<tracks.length-1?"começa em "+fmt(Math.max(0,t[2]-audio.currentTime)):"";
  document.getElementById("status").textContent=audio.paused?(started?"⏸️ Pausado":"Toque em Iniciar para tocar o áudio."):"▶️ Tocando";
  document.getElementById("play").textContent=audio.paused?"▶️ Iniciar":"⏸️ Pausar";

  document.querySelectorAll(".row").forEach((r,i)=>r.classList.toggle("active",i===index));
}

function update(){
  const pos=Math.min(audio.currentTime||0,tracks[index][2]);
  const dur=audio.duration && isFinite(audio.duration) ? audio.duration : tracks[index][2];
  document.getElementById("timer").textContent=fmt(pos);
  document.getElementById("remainCurrent").textContent=fmt(Math.max(0,dur-pos));
  document.getElementById("bar").style.width=Math.min(100,(pos/dur)*100)+"%";
  const elapsed=Math.min(total,starts[index]+pos);
  document.getElementById("showElapsed").textContent=fmt(elapsed);
  document.getElementById("showRemaining").textContent=fmt(Math.max(0,total-elapsed));
  if(index<tracks.length-1){
    document.getElementById("nexttime").textContent="começa em "+fmt(Math.max(0,dur-pos));
  }
}

function buildList(){
  const list=document.getElementById("list");
  list.innerHTML="";
  tracks.forEach((t,i)=>{
    const row=document.createElement("div");
    row.className="row";
    row.innerHTML=`<div class="start">${fmt(starts[i])}</div>
      <div><div class="name">${t[0]}</div><div class="kind">MP3 • ${fmt(t[2])}</div></div>
      <div class="len">${fmt(t[2])}</div>`;
    row.onclick=()=>loadTrack(i,started && !audio.paused);
    list.appendChild(row);
  });
}

document.getElementById("play").onclick=()=>{
  if(audio.paused){
    started=true;
    audio.play().then(()=>render()).catch(()=>{
      document.getElementById("status").textContent="Não foi possível tocar. Verifique se o MP3 está na mesma pasta do index.html.";
    });
  }else{
    audio.pause();
    render();
  }
};

document.getElementById("nextBtn").onclick=()=>{
  if(index<tracks.length-1){ started=true; loadTrack(index+1,true); }
};
document.getElementById("back").onclick=()=>{
  if(audio.currentTime>3){ audio.currentTime=0; }
  else if(index>0){ loadTrack(index-1,started); }
};

audio.addEventListener("timeupdate",update);
audio.addEventListener("loadedmetadata",update);
audio.addEventListener("play",()=>{started=true;render()});
audio.addEventListener("pause",render);
audio.addEventListener("ended",()=>{
  if(index<tracks.length-1) loadTrack(index+1,true);
  else { audio.currentTime=audio.duration||0; render(); update(); }
});

buildList();
loadTrack(0,false);
update();
</script>
</body>
</html>
